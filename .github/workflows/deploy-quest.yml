name: Deploy to Quest

# Installs a published quest release APK on the Quest 3 through the
# Farside-hosted Cloudflare tunnel. Farside must be running on the headset
# with its tunnel started — reaching the headset this way IS the test.
# Manual trigger only.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to install (e.g. quest-2.23.0)'
        required: true
      hostname:
        description: 'Tunnel hostname publishing the Quest adbd (defaults to the ADB_TUNNEL_HOSTNAME secret)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Install cloudflared and adb
        run: |
          # NOTE: cloudflared is pinned to 2026.5.1, NOT latest. Versions
          # >=2026.6.0 have a regression (cloudflare/cloudflared#1674) where
          # `access tcp` ignores service-token credentials (flags, env vars
          # and header injection) and falls back to interactive browser auth,
          # so the tunnel never proxies on a headless runner.
          curl -sSfL -o /tmp/cloudflared.deb https://github.com/cloudflare/cloudflared/releases/download/2026.5.1/cloudflared-linux-amd64.deb
          sudo dpkg -i /tmp/cloudflared.deb
          sudo apt-get update -qq && sudo apt-get install -y -qq adb

      - name: Download the release APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # NOTE: --repo is required because this job does no checkout, so gh
        # cannot infer the repository from a git remote.
        run: gh release download "${{ inputs.tag }}" --repo "${{ github.repository }}" --pattern 'plezy-quest.apk' --dir /tmp

      - name: Install the paired adb key (if configured)
        env:
          ADB_KEY: ${{ secrets.ADB_KEY }}
          ADB_KEY_PUB: ${{ secrets.ADB_KEY_PUB }}
        run: |
          set -euo pipefail
          if [ -z "${ADB_KEY:-}" ] || [ -z "${ADB_KEY_PUB:-}" ]; then
            echo "ADB_KEY/ADB_KEY_PUB not set; continuing with an ephemeral key (the Quest will not trust it)."
            exit 0
          fi
          mkdir -p ~/.android
          printf '%s' "$ADB_KEY" | base64 -d > ~/.android/adbkey
          printf '%s' "$ADB_KEY_PUB" | base64 -d > ~/.android/adbkey.pub
          chmod 600 ~/.android/adbkey ~/.android/adbkey.pub
          adb kill-server 2>/dev/null || true
          echo "paired adb key installed"

      - name: Check the service token at the edge
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          HOST="${{ inputs.hostname }}"
          if [ -z "$HOST" ]; then HOST="${{ secrets.ADB_TUNNEL_HOSTNAME }}"; fi
          # Only the HTTP status is printed; the token itself never hits the log.
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 \
            --header "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            "https://$HOST/" || echo "curl-failed")
          echo "edge status with service token: $code"
          if [ "$code" = "403" ]; then
            echo "The edge rejected the service token (HTTP 403)." >&2
            echo "In the Cloudflare Zero Trust dashboard, add this service token to the Access policy of the application guarding the tunnel hostname." >&2
            exit 1
          fi

      - name: Open the tunnel
        # NOTE: the secrets keep James's CF_ACCESS_CLIENT_ID / CF_ACCESS_CLIENT_SECRET
        # names, but cloudflared's `access` commands read TUNNEL_SERVICE_TOKEN_ID /
        # TUNNEL_SERVICE_TOKEN_SECRET, so they are remapped here.
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          HOST="${{ inputs.hostname }}"
          if [ -z "$HOST" ]; then HOST="${{ secrets.ADB_TUNNEL_HOSTNAME }}"; fi
          if [ -z "$HOST" ]; then
            echo "Set the hostname input or the ADB_TUNNEL_HOSTNAME secret." >&2
            exit 1
          fi
          # Fail fast: without a service token cloudflared falls back to an
          # interactive browser login and the tunnel silently never proxies.
          if [ -z "${TUNNEL_SERVICE_TOKEN_ID:-}" ] || [ -z "${TUNNEL_SERVICE_TOKEN_SECRET:-}" ]; then
            echo "CF_ACCESS_CLIENT_ID / CF_ACCESS_CLIENT_SECRET secrets are empty or not set." >&2
            exit 1
          fi
          cloudflared access tcp --hostname "$HOST" --url 127.0.0.1:5555 > /tmp/cloudflared.log 2>&1 &
          echo $! > /tmp/cloudflared.pid
          sleep 5
          if ! kill -0 "$(cat /tmp/cloudflared.pid)" 2>/dev/null; then
            echo "cloudflared died on startup. Log:" >&2
            cat /tmp/cloudflared.log >&2 || true
            exit 1
          fi
          echo "cloudflared is running. Startup log:"
          cat /tmp/cloudflared.log

      - name: Install on the headset
        run: |
          set -euo pipefail
          # NOTE: `adb connect` exits 0 even when it fails, so poll
          # `adb devices` for a real 'device' state instead of trusting
          # the exit code.
          connected=0
          for i in $(seq 1 24); do
            adb connect 127.0.0.1:5555 >/dev/null 2>&1 || true
            if adb devices | grep -Eq "127\.0\.0\.1:5555[[:space:]]+device$"; then
              connected=1
              echo "connected on attempt $i"
              break
            fi
            echo "attempt $i: $(adb devices | grep '127.0.0.1:5555' | tr '\n' ';' || echo 'not listed')"
            sleep 5
          done
          if [ "$connected" -ne 1 ]; then
            echo "=== adb never reached 'device' state ===" >&2
            adb devices -l >&2 || true
            echo "=== full cloudflared log ===" >&2
            cat /tmp/cloudflared.log >&2 || true
            exit 1
          fi
          adb -s 127.0.0.1:5555 wait-for-device
          adb -s 127.0.0.1:5555 install -r /tmp/plezy-quest.apk

      - name: Verify installed version
        run: adb -s 127.0.0.1:5555 shell dumpsys package com.edde746.plezy | grep -i versionName

      - name: Close the tunnel
        if: always()
        run: kill "$(cat /tmp/cloudflared.pid)" || true
