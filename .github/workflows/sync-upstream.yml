name: Sync upstream release

# Watches edde746/plezy releases. On a new tag: mirrors the tag, rebases
# main's workflow commits, rebases the quest-enhancements fix stack onto it,
# and triggers the quest build automatically. Fixes upstream already merged
# become empty and are dropped by the rebase automatically ("smart apply").
# A conflict halts the job and reports instead of pushing anything.

on:
  schedule:
    - cron: '20 16 * * *'  # daily ~09:20 America/Los_Angeles
  workflow_dispatch:

permissions:
  contents: write
  # Upstream releases can change .github/workflows/* files; mirroring such a
  # tag is rejected without workflows:write (2026-10-21/22 sync failures on 2.24.0).
  workflows: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "jmez11"
          git config user.email "40301782+jmez11@users.noreply.github.com"

      - name: Check for new upstream release
        id: check
        run: |
          git remote add upstream https://github.com/edde746/plezy.git || true
          LATEST=$(curl -sSf https://api.github.com/repos/edde746/plezy/releases/latest | jq -r .tag_name)
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          git fetch upstream tag "$LATEST"
          # Synced means the fix stack already contains the latest upstream tag.
          # (The mirrored tag alone isn't enough: a previous run may have
          # mirrored it without finishing the rebase.)
          if git merge-base --is-ancestor "$LATEST" origin/quest-enhancements 2>/dev/null; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mirror upstream tag and rebase main
        if: steps.check.outputs.needed == 'true'
        id: mainrebase
        run: |
          TAG="${{ steps.check.outputs.latest }}"
          git remote add upstream https://github.com/edde746/plezy.git || true
          git fetch upstream tag "$TAG"
          git fetch upstream main
          git push origin "refs/tags/$TAG:refs/tags/$TAG"
          # main carries our workflow files on top of upstream, so it can't
          # fast-forward: rebase those commits onto the new upstream main.
          git checkout -B main origin/main
          if git rebase upstream/main; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            git push --force-with-lease origin main
          else
            git rebase --abort || true
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

      - name: Rebase quest-enhancements onto the new tag
        if: steps.check.outputs.needed == 'true' && steps.mainrebase.outputs.conflict != 'true'
        id: rebase
        run: |
          TAG="${{ steps.check.outputs.latest }}"
          git fetch origin quest-enhancements
          git checkout -B quest-enhancements origin/quest-enhancements
          # Fixes upstream already absorbed show up as '-' (patch-equivalent upstream).
          git cherry "tags/$TAG" HEAD | grep '^-' | cut -d' ' -f2 > /tmp/absorbed.txt || true
          {
            echo "absorbed<<EOF"
            cat /tmp/absorbed.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          AHEAD=$(git rev-list --count "tags/$TAG"..HEAD)
          if [ "$AHEAD" -eq 0 ]; then
            # Nothing unique left (all fixes absorbed, or branch behind): fast-forward.
            git reset --hard "tags/$TAG"
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          elif git rebase --onto "tags/$TAG" "$(git merge-base HEAD "tags/$TAG")"; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            git rebase --abort || true
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git push --force-with-lease origin quest-enhancements

      - name: Report
        if: steps.check.outputs.needed == 'true'
        run: |
          TAG="${{ steps.check.outputs.latest }}"
          {
            echo "## Upstream $TAG sync report"
            echo ""
            if [ "${{ steps.mainrebase.outputs.conflict }}" = "true" ]; then
              echo "❌ Rebasing main's workflow commits onto upstream $TAG **conflicted**. Nothing was pushed."
              echo "Rebase main locally, resolve, force-push, then re-run 'Sync upstream release'."
            elif [ "${{ steps.rebase.outputs.conflict }}" = "true" ]; then
              echo "❌ The rebase of quest-enhancements onto upstream $TAG **conflicted**. Nothing was pushed."
              echo "Rebase it locally, resolve, force-push quest-enhancements, then dispatch 'Build quest release'."
            else
              echo "✅ Synced upstream $TAG: tag mirrored, main rebased onto upstream/main, quest-enhancements rebased and pushed."
              echo ""
              ABSORBED="${{ steps.rebase.outputs.absorbed }}"
              if [ -n "$ABSORBED" ]; then
                echo "Upstream already absorbed these fixes (dropped from the stack):"
                echo '```'
                echo "$ABSORBED"
                echo '```'
              fi
              echo "Next: 'Deploy to Quest' with tag \`quest-$TAG\` when ready to install on the headset."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger quest build
        if: steps.check.outputs.needed == 'true' && steps.mainrebase.outputs.conflict != 'true' && steps.rebase.outputs.conflict != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # workflow_dispatch via the API runs fine on GITHUB_TOKEN (only
          # push-triggered reruns are suppressed). The build job creates the
          # quest-<tag> release tag itself, idempotently.
          TAG="quest-${{ steps.check.outputs.latest }}"
          echo "Triggering build-release.yml for $TAG"
          gh workflow run build-release.yml --ref main -f tag="$TAG" -f ref=quest-enhancements
